[package]
name = "samurai"
version = "0.1.0"
description = "Samurai EDR with Amoeba repair — Ronin Softworx / Neomark Holdings LLC"
authors = ["Ronin Softworx"]
edition = "2021"

[lib]
name = "samurai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-autostart = "2"
