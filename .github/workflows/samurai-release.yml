name: Samurai release

on:
  workflow_dispatch:
  push:
    tags:
      - "samurai-v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebKit dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: samurai/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./samurai/src-tauri -> target"
      - name: Install frontend dependencies
        working-directory: samurai
        run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: samurai
          tagName: samurai-v__VERSION__
          releaseName: Samurai v__VERSION__
          releaseBody: |
            Ronin Softworx local EDR for creators.

            - Windows: run the NSIS installer
            - macOS: open the DMG (Gatekeeper may require right-click → Open until we notarize)
            - Linux: install the .deb or run the AppImage

            Heuristic scanning is built in. Install yara, clamscan, and tshark on PATH for the full engine set.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
